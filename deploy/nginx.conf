# qm-admin nginx 配置
#
# 职责：
# - 静态资源托管（带长效缓存）
# - SPA history 模式 fallback 到 index.html
# - /api/* 反代到后端 Fastify server
#
# 后端地址由环境变量 BACKEND_URL 注入（docker-entrypoint 用 envsubst 渲染）
# 也可以直接改成 http://qm-server:3000（容器 network 内联）

server {
    listen       80;
    server_name  _;
    server_tokens off;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 静态资源（带 hash 文件名，1 年长缓存）
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # API 反代（生产环境后端走容器网络或反代域名）
    # 默认假设后端跑在 host.docker.internal:3000；上生产改成实际地址
    location /api/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # SPA fallback：所有路由打回 index.html，由 React Router 接管
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff"    always;
    add_header Referrer-Policy          "no-referrer-when-downgrade" always;
}
